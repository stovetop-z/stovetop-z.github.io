<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Deep void background gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Vibrant cyan-to-indigo core gradient -->
    <linearGradient id="favZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Subtle border glow -->
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Container tile with rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="url(#favBorder)" stroke-width="1.5"/>

  <!-- Orbital trajectory arc -->
  <path d="M 12 32 A 20 20 0 0 1 52 32" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4"/>

  <!-- High-contrast glyph "Z" -->
  <path d="M 19 20 L 45 20 L 19 44 L 45 44"
        fill="none"
        stroke="url(#favZ)"
        stroke-width="7"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- High-luminance inner core track -->
  <path d="M 21 20 L 43 20 L 21 44 L 43 44"
        fill="none"
        stroke="#f8fafc"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.85"/>

  <!-- Quantum / Synaptic Node Accent -->
  <circle cx="45" cy="20" r="2.5" fill="#38bdf8"/>
  <circle cx="19" cy="44" r="2.5" fill="#818cf8"/>
</svg>
